version: '3.8'

services:
  # Development environment
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev

  # Staging environment  
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: staging
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=staging
    profiles:
      - staging

  # Integration environment
  app-integration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: integration
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=integration
    profiles:
      - integration

  # Production environment
  app-production:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - production

  # Database for local development (optional)
  postgres-dev:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: waschbar_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    profiles:
      - dev
      - db

volumes:
  postgres_dev_data:
